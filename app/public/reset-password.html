<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Set New Password — Shawtty</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=Geist:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: '#0b0d12',
              'ink-2': '#11141b',
              'ink-3': '#181c25',
              'ink-4': '#20252f',
              line: '#232836',
              'line-2': '#313848',
              fg: '#eceef3',
              'fg-2': '#a3a9b8',
              'fg-3': '#6b7284',
              mblue: '#58c4dd',
              myellow: '#f2d45c',
              mgreen: '#83c167',
              mred: '#fc6255',
            },
            fontFamily: {
              display: ['Newsreader', 'ui-serif', 'Georgia', 'serif'],
              sans: ['Geist', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
            },
            fontSize: {
              '2xs': '11px',
              '3xs': '10px',
            },
            borderRadius: {
              sm: '6px',
              md: '10px',
              lg: '14px',
              xl: '20px',
              phone: '34px',
            },
            boxShadow: {
              card: '0 1px 0 0 rgba(255, 255, 255, 0.04) inset, 0 8px 24px -12px rgba(0, 0, 0, 0.6)',
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/toast.js"></script>
  </head>
  <body class="bg-ink font-sans text-fg min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
      <!-- Brand Logo Header -->
      <div class="flex justify-center mb-6">
        <a href="/" class="flex items-center gap-2.5 text-decoration-none">
          <svg viewBox="0 0 18 28" style="height: 28px; width: 18px;">
            <rect x="0.75" y="0.75" width="16.5" height="26.5" rx="3.5" fill="none" stroke="#eceef3" stroke-width="1.5" />
            <path d="M7 10.5 L12.5 14 L7 17.5 Z" fill="#f2d45c" />
          </svg>
          <span class="font-display text-3xl tracking-tight text-fg font-normal">Shawtty</span>
        </a>
      </div>

      <!-- Auth Card -->
      <div class="rounded-xl border border-line bg-ink-2 p-7 shadow-card">
        <div class="mb-6">
          <span class="font-mono text-3xs uppercase tracking-widest text-mblue">SECURITY</span>
          <h1 class="mt-1 font-display text-3xl font-light text-fg">Set new password</h1>
          <p class="mt-1.5 text-sm font-light text-fg-2">Choose a strong new password for your account.</p>
        </div>

        <form id="resetForm" class="flex flex-col gap-4">
          <div>
            <label class="flex items-center gap-1.5 font-mono text-3xs uppercase tracking-widest text-fg-3 mb-1.5" for="newPassword">
              <i class="ti ti-lock text-xs"></i>
              <span>New Password</span>
            </label>
            <input
              type="password"
              id="newPassword"
              required
              minlength="8"
              autocomplete="new-password"
              placeholder="At least 8 characters"
              class="w-full bg-ink border border-line-2 rounded-sm px-3.5 py-2.5 text-sm text-fg outline-none focus:border-myellow placeholder:text-fg-3 transition-colors"
            />
          </div>

          <div>
            <label class="flex items-center gap-1.5 font-mono text-3xs uppercase tracking-widest text-fg-3 mb-1.5" for="confirmPassword">
              <i class="ti ti-shield-check text-xs"></i>
              <span>Confirm New Password</span>
            </label>
            <input
              type="password"
              id="confirmPassword"
              required
              minlength="8"
              autocomplete="new-password"
              placeholder="Re-enter password"
              class="w-full bg-ink border border-line-2 rounded-sm px-3.5 py-2.5 text-sm text-fg outline-none focus:border-myellow placeholder:text-fg-3 transition-colors"
            />
          </div>

          <button
            type="submit"
            id="resetSubmitBtn"
            class="mt-2 w-full rounded-sm bg-myellow py-2.5 text-sm font-medium text-ink hover:bg-fg transition-colors flex items-center justify-center gap-1.5"
          >
            <span>Update Password</span>
            <i class="ti ti-arrow-right"></i>
          </button>
        </form>

        <!-- Feedback Notification -->
        <div id="resetFeedback" class="mt-4 text-xs font-mono" hidden></div>

        <div class="mt-6 pt-5 border-t border-line text-center text-xs text-fg-3">
          <a href="/login" class="text-myellow hover:underline font-medium inline-flex items-center gap-1">
            <i class="ti ti-arrow-left text-xs"></i>
            <span>Back to Sign In</span>
          </a>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('resetForm');
        const btn = document.getElementById('resetSubmitBtn');

        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        if (!token) {
          toast.error('Invalid or missing reset token. Please request a new link.');
          if (btn) btn.disabled = true;
          return;
        }

        form?.addEventListener('submit', async (e) => {
          e.preventDefault();
          const p1 = document.getElementById('newPassword')?.value;
          const p2 = document.getElementById('confirmPassword')?.value;

          if (!p1 || !p2) return;
          if (p1 !== p2) {
            toast.warning('Passwords do not match.');
            return;
          }
          if (p1.length < 8) {
            toast.warning('Password must be at least 8 characters.');
            return;
          }

          btn.disabled = true;
          const loadingToast = toast.loading('Updating your password...');

          try {
            const res = await fetch('/api/auth/reset-password', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ newPassword: p1, token }),
            });

            const data = await res.json();
            loadingToast.dismiss();

            if (res.ok) {
              toast.success('Password updated successfully! Redirecting to login...');
              setTimeout(() => { window.location.href = '/login'; }, 1000);
            } else {
              throw new Error(data?.message || data?.error || 'Failed to reset password');
            }
          } catch (err) {
            loadingToast.dismiss();
            toast.error(err.message);
            btn.disabled = false;
          }
        });
      });
    </script>
  </body>
</html>

<script>
  const tl = gsap.timeline({ paused: true });
  tl.fromTo("#bcontent", { y: 110, opacity: 0 }, { y: 0, opacity: 1, duration: 0.47, ease: "power3.out" }, 0);
  tl.fromTo("#bsticker", { scale: 2.0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(2.0)" }, 0.13);
  document.querySelectorAll("#bhead .w").forEach((el, i) => {
    tl.fromTo(el, { y: 50, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.45, ease: "back.out(1.7)" }, 0.2 + i * 0.067);
  });
  tl.fromTo("#bbody", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.4);
  ["#bring0", "#bring1", "#bring2"].forEach((sel, i) => {
    tl.fromTo(sel, { scale: 1, opacity: 0.7 },
      { scale: 2.1, opacity: 0, duration: 1.0, ease: "power1.out", repeat: 2 }, i * 0.33);
  });
  ["#bbadge0", "#bbadge1", "#bbadge2", "#bbadge3"].forEach((sel, i) => {
    tl.fromTo(sel, { scale: 0.4, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.7)" }, 0.33 + i * 0.27);
  });
  window.__timelines = window.__timelines || {};
  window.__timelines["scene-3"] = tl;
